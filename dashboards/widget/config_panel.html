<style>
  .config-panel {
    font-family: 'Roboto', sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
  }
  .section {
    margin-bottom: 20px;
    padding: 15px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    background: #fafafa;
  }
  .section h3 {
    margin-top: 0;
    color: #1976D2;
    border-bottom: 2px solid #1976D2;
    padding-bottom: 8px;
  }
  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-weight: 500;
    margin-bottom: 4px;
    color: #424242;
  }
  .field input, .field select {
    width: 100%;
    padding: 8px;
    border: 1px solid #bdbdbd;
    border-radius: 4px;
    font-size: 14px;
    box-sizing: border-box;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #1976D2;
    box-shadow: 0 0 0 2px rgba(25,118,210,0.2);
  }
  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-save {
    background: #4CAF50;
    color: white;
  }
  .btn-save:hover { background: #388E3C; }
  .btn-reset {
    background: #f44336;
    color: white;
  }
  .btn-reset:hover { background: #c62828; }
  .status {
    margin-top: 15px;
    padding: 10px;
    border-radius: 4px;
    display: none;
  }
  .status.success {
    display: block;
    background: #E8F5E9;
    color: #2E7D32;
    border: 1px solid #A5D6A7;
  }
  .status.error {
    display: block;
    background: #FFEBEE;
    color: #C62828;
    border: 1px solid #EF9A9A;
  }
  .hint {
    font-size: 12px;
    color: #757575;
    margin-top: 4px;
  }
</style>

<div class="config-panel">
  <h2>Configuracion del Dispositivo</h2>
  <div class="hint">Rellena solo los campos que quieras cambiar. Los vacios se mantienen igual.</div>
  
  <div class="section">
    <h3>WiFi</h3>
    <div class="field">
      <label for="wifi_ssid">SSID (nombre de la red)</label>
      <input type="text" id="wifi_ssid" placeholder="MiRedWiFi">
    </div>
    <div class="field">
      <label for="wifi_pass">Contraseña</label>
      <input type="password" id="wifi_pass" placeholder="••••••••">
    </div>
  </div>

  <div class="section">
    <h3>MQTT</h3>
    <div class="field">
      <label for="mqtt_broker">IP del Broker</label>
      <input type="text" id="mqtt_broker" placeholder="192.168.1.100">
    </div>
    <div class="field">
      <label for="mqtt_topic_cmd">Topic Comandos</label>
      <input type="text" id="mqtt_topic_cmd" value="waterly/comandos">
    </div>
    <div class="field">
      <label for="mqtt_topic_dat">Topic Datos</label>
      <input type="text" id="mqtt_topic_dat" value="waterly/datos">
    </div>
  </div>

  <div class="section">
    <h3>Sensor AS7265x</h3>
    <div class="field">
      <label for="sensor_gain">Gain (amplificacion)</label>
      <select id="sensor_gain">
        <option value="">-- No cambiar --</option>
        <option value="0">1x (bajo)</option>
        <option value="1">4x (medio-bajo)</option>
        <option value="2">16x (medio-alto)</option>
        <option value="3">64x (alto)</option>
      </select>
    </div>
    <div class="field">
      <label for="sensor_integration">Integration Time (x2.8ms)</label>
      <input type="number" id="sensor_integration" placeholder="No cambiar" min="1" max="255">
      <small>50 = 140ms, 255 = 714ms</small>
    </div>
    <div class="field">
      <label for="sensor_led_current">LED Current (intensidad luz)</label>
      <select id="sensor_led_current">
        <option value="">-- No cambiar --</option>
        <option value="0">12.5mA (bajo)</option>
        <option value="1">25mA (medio)</option>
        <option value="2">50mA (alto)</option>
        <option value="3">100mA (maximo)</option>
      </select>
    </div>
  </div>

  <div class="section">
    <h3>BLE Provisioning</h3>
    <div class="field">
      <label for="ble_pop">POP Password</label>
      <input type="text" id="ble_pop" placeholder="No cambiar">
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-save" onclick="saveConfig()">Guardar y Reiniciar</button>
    <button class="btn btn-reset" onclick="factoryReset()">Factory Reset</button>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
function getDeviceId() {
  // ThingsBoard inyecta self.ctx cuando el widget tiene una entidad configurada
  if (typeof self !== 'undefined' && self.ctx && self.ctx.defaultSubscription) {
    var sub = self.ctx.defaultSubscription;
    if (sub.entityId) return sub.entityId;
    if (sub.entityIds && sub.entityIds.length > 0) return sub.entityIds[0];
  }
  return null;
}

function sendRPC(method, params, callback) {
  var deviceId = getDeviceId();
  
  if (!deviceId) {
    callback(false, 'No se pudo obtener el ID del dispositivo. Asegurate de configurar el dispositivo en la pestaña "Data" del widget.');
    return;
  }
  
  // Metodo 1: Usar self.ctx.controlApi (disponible en widgets con entidad)
  if (typeof self !== 'undefined' && self.ctx && self.ctx.controlApi) {
    self.ctx.controlApi.sendOneWayCommand(deviceId, method, params, 5000).then(function() {
      callback(true, null);
    }).catch(function(err) {
      callback(false, 'Error: ' + (err.message || err));
    });
    return;
  }
  
  // Metodo 2: Usar fetch con credentials (hereda la sesion del dashboard)
  fetch('/api/plugins/rpc/oneway/' + deviceId, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ method: method, params: params })
  }).then(function(resp) {
    if (resp.ok) {
      callback(true, null);
    } else {
      return resp.text().then(function(text) {
        callback(false, 'Error ' + resp.status + ': ' + text);
      });
    }
  }).catch(function(err) {
    callback(false, 'Error de red: ' + err.message);
  });
}

function saveConfig() {
  var config = {};
  
  var ssid = document.getElementById('wifi_ssid').value.trim();
  if (ssid) config.wifi_ssid = ssid;
  
  var pass = document.getElementById('wifi_pass').value;
  if (pass) config.wifi_pass = pass;
  
  var broker = document.getElementById('mqtt_broker').value.trim();
  if (broker) config.mqtt_broker = broker;
  
  var cmdTopic = document.getElementById('mqtt_topic_cmd').value.trim();
  if (cmdTopic && cmdTopic !== 'waterly/comandos') config.mqtt_topic_cmd = cmdTopic;
  
  var datTopic = document.getElementById('mqtt_topic_dat').value.trim();
  if (datTopic && datTopic !== 'waterly/datos') config.mqtt_topic_dat = datTopic;
  
  var gain = document.getElementById('sensor_gain').value;
  if (gain !== '') config.sensor_gain = parseInt(gain);
  
  var integration = document.getElementById('sensor_integration').value;
  if (integration) config.sensor_integration = parseInt(integration);
  
  var led = document.getElementById('sensor_led_current').value;
  if (led !== '') config.sensor_led_current = parseInt(led);
  
  var pop = document.getElementById('ble_pop').value.trim();
  if (pop) config.ble_pop = pop;
  
  if (Object.keys(config).length === 0) {
    showStatus('No hay cambios para guardar. Rellena al menos un campo.', 'error');
    return;
  }
  
  showStatus('Enviando configuracion al ESP32...', 'success');
  
  sendRPC('saveConfig', config, function(ok, err) {
    if (ok) {
      showStatus('Configuracion enviada. El ESP32 se reiniciara en 2s.', 'success');
    } else {
      showStatus(err, 'error');
    }
  });
}

function factoryReset() {
  if (!confirm('¿Estas seguro? Se borraran TODAS las configuraciones.')) return;
  
  showStatus('Enviando Factory Reset...', 'error');
  
  sendRPC('factoryReset', {}, function(ok, err) {
    if (ok) {
      showStatus('Factory Reset enviado. El ESP32 se reiniciara sin configuracion.', 'success');
    } else {
      showStatus(err, 'error');
    }
  });
}

function showStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
  setTimeout(function() { el.className = 'status'; }, 8000);
}
</script>
