<div class="config-panel">
  <h2>Configuracion del Dispositivo</h2>
  <div class="hint">Rellena solo los campos que quieras cambiar. Los vacios se mantienen igual.</div>
  
  <div class="section">
    <h3>WiFi</h3>
    <div class="field">
      <label for="wifi_ssid">SSID (nombre de la red)</label>
      <input type="text" id="wifi_ssid" placeholder="MiRedWiFi">
    </div>
    <div class="field">
      <label for="wifi_pass">Contraseña</label>
      <input type="password" id="wifi_pass" placeholder="••••••••">
    </div>
  </div>

  <div class="section">
    <h3>MQTT</h3>
    <div class="field">
      <label for="mqtt_broker">IP del Broker</label>
      <input type="text" id="mqtt_broker" placeholder="192.168.1.100">
    </div>
    <div class="field">
      <label for="mqtt_topic_cmd">Topic Comandos</label>
      <input type="text" id="mqtt_topic_cmd" value="waterly/comandos">
    </div>
    <div class="field">
      <label for="mqtt_topic_dat">Topic Datos</label>
      <input type="text" id="mqtt_topic_dat" value="waterly/datos">
    </div>
  </div>

  <div class="section">
    <h3>Sensor AS7265x</h3>
    <div class="field">
      <label for="sensor_gain">Gain (amplificacion)</label>
      <select id="sensor_gain">
        <option value="">-- No cambiar --</option>
        <option value="0">1x (bajo)</option>
        <option value="1">4x (medio-bajo)</option>
        <option value="2">16x (medio-alto)</option>
        <option value="3">64x (alto)</option>
      </select>
    </div>
    <div class="field">
      <label for="sensor_integration">Integration Time (x2.8ms)</label>
      <input type="number" id="sensor_integration" placeholder="No cambiar" min="1" max="255">
      <small>50 = 140ms, 255 = 714ms</small>
    </div>
    <div class="field">
      <label for="sensor_led_current">LED Current (intensidad luz)</label>
      <select id="sensor_led_current">
        <option value="">-- No cambiar --</option>
        <option value="0">12.5mA (bajo)</option>
        <option value="1">25mA (medio)</option>
        <option value="2">50mA (alto)</option>
        <option value="3">100mA (maximo)</option>
      </select>
    </div>
  </div>

  <div class="section">
    <h3>Modelo ML</h3>
    <div id="modelInfo" class="model-info">
      <div class="model-row">
        <span class="model-label">Estado:</span>
        <span id="modelStatus" class="model-value">Cargando...</span>
      </div>
      <div class="model-row">
        <span class="model-label">Tipo:</span>
        <span id="modelType" class="model-value">-</span>
      </div>
      <div class="model-row">
        <span class="model-label">Baseline:</span>
        <span id="modelBaseline" class="model-value">-</span>
      </div>
      <div class="model-row">
        <span class="model-label">Muestras:</span>
        <span id="modelSamples" class="model-value">-</span>
      </div>
      <div class="model-row" id="modelMetricsRow" style="display:none;">
        <span class="model-label">Metricas:</span>
        <span id="modelMetrics" class="model-value">-</span>
      </div>
    </div>
    <div class="model-actions">
      <button class="btn btn-download" id="btn-download">Descargar Modelo</button>
      <button class="btn btn-upload-model" id="btn-upload-model">Cargar Modelo</button>
    </div>
    <div class="field" id="modelUploadField" style="display:none;">
      <label for="modelFile">Seleccionar archivo .pkl</label>
      <input type="file" id="modelFile" accept=".pkl">
      <div id="modelFileInfo" class="file-info" style="display:none;"></div>
    </div>
  </div>

  <div class="section">
    <h3>OTA</h3>
    <div class="field">
      <label for="ota_url">Version URL</label>
      <input type="text" id="ota_url" placeholder="http://waterly.local:8000/firmware/version.json">
    </div>
  </div>

  <div class="section">
    <h3>BLE Provisioning</h3>
    <div class="field">
      <label for="ble_pop">POP Password</label>
      <input type="text" id="ble_pop" placeholder="No cambiar">
    </div>
  </div>

  <div class="section">
    <h3>Configuracion</h3>
    <div class="config-actions">
      <button class="btn btn-download-config" id="btn-download-config">Descargar Config</button>
      <button class="btn btn-upload-config" id="btn-upload-config">Cargar Config</button>
    </div>
    <div class="field" id="configUploadField" style="display:none;">
      <label for="configFile">Seleccionar archivo .json</label>
      <input type="file" id="configFile" accept=".json">
      <div id="configFileInfo" class="file-info" style="display:none;"></div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-save" id="btn-save">Guardar y Reiniciar</button>
    <button class="btn btn-reset" id="btn-reset">Factory Reset</button>
  </div>

  <div id="status" class="status"></div>
</div>
