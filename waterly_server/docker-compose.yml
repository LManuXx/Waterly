version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: waterly_mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: waterly_db
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=waterly_org
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=admin
    volumes:
      - influxdb_data:/var/lib/influxdb2

  waterly_brain:
    build: ./backend
    container_name: waterly_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
      - MOSQUITTO_HOST=mosquitto
      - TB_ENABLED=${TB_ENABLED:-false}
      - TB_HOST=thingsboard
      - PYTHONUNBUFFERED=1
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=admin
      - INFLUX_ORG=waterly_org
      - INFLUX_BUCKET=sensor_data
    volumes:
      - waterly_model:/app/data/
      - ./firmware:/app/firmware
    depends_on:
      - mosquitto
      - influxdb

  # Panel web propio (Vite/React → nginx). Puerto host 3000.
  waterly_ui:
    build: ./frontend
    container_name: waterly_ui
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - waterly_brain

  # Opt-in: COMPOSE_PROFILES=thingsboard TB_ENABLED=true docker compose up -d
  thingsboard:
    profiles: ["thingsboard"]
    image: thingsboard/tb-postgres
    container_name: waterly_tb
    restart: always
    ports:
      - "8080:9090"
      - "1884:1883"
    environment:
      - TB_QUEUE_TYPE=in-memory
    volumes:
      - tb_data:/data
      - tb_log:/var/log/thingsboard
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/login" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  mdns_publisher:
    build: ./mdns_publisher
    container_name: waterly_mdns
    restart: always
    network_mode: host

volumes:
  influxdb_data:
  tb_data:
  tb_log:
  waterly_model:
